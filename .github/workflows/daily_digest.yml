name: 📚 Daily ArXiv Digest

on:
  schedule:
    # ── 北京时间 周二~周六 凌晨 1:00 运行 ──
    # 北京 01:00 = UTC 前一天 17:00
    # UTC 周一~周五 17:00 = 北京 周二~周六 01:00
    - cron: "0 17 * * 1-5"

  # 手动触发（测试用，可以选择强制运行）
  workflow_dispatch:
    inputs:
      force_run:
        description: "强制运行（忽略周末跳过逻辑）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run digest
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          EMAIL_ADDRESS:   ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL:        ${{ secrets.TO_EMAIL }}
          SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          FORCE_RUN:       ${{ github.event.inputs.force_run || 'false' }}
          LLM_INTERVAL_SECONDS: "0"
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python main.py

      - name: 📎 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: output/
          retention-days: 30