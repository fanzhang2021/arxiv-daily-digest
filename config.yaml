# ============================================
# ArXiv Daily Digest 配置文件
# ============================================

search:
  categories:
    - cs.SE

  keywords:
    - "Goedel-Code-Prover"

# "none" - 只按分类搜索，完全忽略关键字
# "filter" - 按分类搜索，用关键字本地过滤（推荐，精准）
# "query" - 分类+关键字一起发给arXiv查询d_mode: "none"
  keyword_mode: "none"

  max_papers: 100

  # ── 日期控制 ──
  # "yesterday" = 只抓昨天的论文（推荐，配合凌晨定时任务）
  # "today"     = 只抓今天的
  # "custom"    = 使用 days_back 自定义范围
  fetch_mode: "custom"

  # 仅 fetch_mode: "custom" 时生效
  days_back: 3

  timezone: "Asia/Shanghai"

  # ── 跳过无更新日 ──
  # arXiv 周六周日不更新论文
  # 开启后：周日、周一自动跳过（因为前一天没有新论文）
  skip_no_arxiv_days: true

# LLM 配置
llm:
  model: "deepseek-chat"
  language: "中文"
  base_url: "https://api.deepseek.com/v1"

# 邮件配置
email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  subject_prefix: "📚 每日ArXiv论文精选"