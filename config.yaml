# ============================================
# ArXiv Daily Digest 配置文件
# ============================================

search:
  categories:
    - cs.SE
    - cs.CL
    - cs.DC
    - cs.AI

  keywords:
    - "code"
    - "program"
    - "software"
    - "debugging"
    - "hpc"
    - "parallel"
    - "mpi"
    - "parallelization"
    - "openmp"
    - "benchmark"

  keyword_mode: "filter"

  filter_exempt_categories:
    - cs.SE
    - cs.DC

  max_papers: 150
  days_back: 4
  timezone: "Asia/Shanghai"

llm:
  model: "deepseek-chat"
  language: "中文"
  base_url: "https://api.deepseek.com/v1"

llm_filter: #这两个分类下，不进行LLM过滤
  enabled: true
  target_categories:
    - cs.SE
    - cs.DC

email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  subject_prefix: "📚 每日ArXiv论文精选"